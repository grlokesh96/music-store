name: Enterprise DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          services=$(ls -1 services | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "matrix={\"service\":$services}" >> $GITHUB_OUTPUT

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: matrix.service == 'frontend' || matrix.service == 'cart-service' || matrix.service == 'api-gateway' || matrix.service == 'load-generator'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Setup Java
        if: matrix.service == 'catalog-service'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Setup Python
        if: matrix.service == 'order-service' || matrix.service == 'shipping-service'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Ruby
        if: matrix.service == 'payment-service'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup .NET
        if: matrix.service == 'inventory-service'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Install deps & test
        run: |
          case "${{ matrix.service }}" in
            frontend|cart-service|api-gateway|load-generator)
              cd services/${{ matrix.service }} && npm ci && npm test || true ;;
            catalog-service)
              cd services/${{ matrix.service }} && mvn -B verify ;;
            order-service|shipping-service)
              cd services/${{ matrix.service }} && pip install -r requirements.txt && python -m pytest || true ;;
            payment-service)
              cd services/${{ matrix.service }} && bundle install && bundle exec rspec || true ;;
            inventory-service)
              cd services/${{ matrix.service }} && dotnet restore && dotnet test ;;
          esac
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.service }}
          path: services/${{ matrix.service }}/**/test-results.xml

  semgrep:
    needs: discover
    runs-on: ubuntu-latest
    container: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep ci --config=auto --sarif --output=semgrep-results.sarif || true
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  hadolint:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile"
          recursive: true
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif || true
      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  gitleaks:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  containers:
    needs: [discover, validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/music-store-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/music-store-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/music-store-${{ matrix.service }}:latest
          format: sarif
          output: image-${{ matrix.service }}.sarif
      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: image-${{ matrix.service }}.sarif

  slack-notification:
    needs: [validate, security, containers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "CI completed for ${{ github.repository }}",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*${{ github.repository }}* | ${{ github.ref_name }} | ${{ github.actor }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
